name = "lpu-scan-scheduler"
main = "worker/index.js"
compatibility_date = "2026-10-26"
workers_dev = true

[triggers]
crons = ["*/5 * * * *"]

[durable_objects]
bindings = [{ name = "SCAN_SCHEDULER", class_name = "ScanScheduler" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ScanScheduler"]

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.1
